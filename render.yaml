services:
  - type: web
    name: netshare
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: NETSHARE_SECRET_KEY
        generateValue: true
