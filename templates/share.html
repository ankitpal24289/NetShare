<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Share {{ file.name }} | NetShare</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">N</span><span>NetShare</span></a><span class="top-note">Shareable download</span></header>
<main class="container narrow"><section class="upload-panel share-page"><p class="eyebrow">SHARED FILE</p><h1>{{ file.name }}</h1><p class="hero-text">Download this file from NetShare.</p><p class="share-meta">Size: {{ file.size }} bytes</p><a class="button primary" href="{{ download_url }}">Download file ↓</a><p><a href="{{ url_for('index') }}">← Back to NetShare</a></p></section></main><footer><span>NetShare • Networking &amp; Web Technologies Mini-Project</span></footer></body></html>
